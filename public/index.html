<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VX Pages — Crie Landing Pages com IA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230d2626'/><text y='.9em' font-size='70' x='10'>Vx</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #052F33;
      color: #FFFFFF;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-optical-sizing: auto;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
      text-align: center;
      padding: 24px;
    }
    .badge {
      background: rgba(0,255,133,.1);
      border: 1px solid rgba(0,255,133,.3);
      color: #00FF85;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 100px;
      letter-spacing: .5px;
    }
    h1 { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 800; letter-spacing: -1px; line-height: 1.1; }
    h1 span { color: #00FF85; }
    p { color: #7ab5be; font-size: 1rem; max-width: 480px; line-height: 1.7; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: #00FF85;
      color: #052F33;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: opacity .15s, transform .15s;
    }
    .btn:hover { opacity: .9; transform: translateY(-1px); }
    .btn-outline {
      background: transparent;
      color: #FFFFFF;
      border: 1px solid rgba(255,255,255,.12);
    }
    .btn-outline:hover { background: rgba(255,255,255,.05); }
    .cta-group { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .coming-soon { font-size: 0.75rem; color: #7ab5be; }
  </style>
</head>
<body>
  <div class="badge">Em breve • Disponível em 2025</div>
  <h1>Crie páginas que<br><span>convertem de verdade</span></h1>
  <p>Landing pages, páginas de vendas e sites profissionais criados com IA em minutos — sem precisar de programador.</p>
  <div class="cta-group">
    <a href="/login" class="btn">Começar grátis →</a>
    <a href="/pgnvnds" class="btn btn-outline">Conheça os planos</a>
  </div>
  <p class="coming-soon">Site institucional completo em breve.</p>
</body>
</html>
